[package]
name = "ucdp-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ucdp-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
full_moon = "2.0"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
rand = "0.8"
rmpv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
walkdir = "2.5"
